kind = "video"
previewPath = "/"
title = "Instagram紹介動画"
description = "水泳教室の欠席・遅刻連絡から振替予約までを紹介する、9:16・1080pのInstagram Reels向け縦型動画。"
version = "1.0.0"
id = "artifacts/instagram-app-intro"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22762

[services.development]
run = "pnpm --filter @workspace/instagram-app-intro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/instagram-app-intro", "run", "build" ]
serve = "static"
publicDir = "artifacts/instagram-app-intro/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22762"
BASE_PATH = "/"
